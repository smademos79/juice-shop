# Plain Kubernetes manifest (alternative to the Helm chart)
# kubectl apply -f deploy/k8s/juice-shop.yaml  &&  kubectl port-forward svc/juice-shop 3000:80
apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  labels: { app: juice-shop }
spec:
  replicas: 1
  selector: { matchLabels: { app: juice-shop } }
  template:
    metadata: { labels: { app: juice-shop } }
    spec:
      imagePullSecrets: [ { name: jfrog-pull } ]
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 0, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: juice-shop
          image: <server>.jfrog.io/juice-docker-prod-local/juice-shop:<build-number>
          ports: [ { name: http, containerPort: 3000 } ]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          readinessProbe: { httpGet: { path: /rest/admin/application-version, port: http }, initialDelaySeconds: 15 }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata: { name: juice-shop }
spec:
  selector: { app: juice-shop }
  ports: [ { name: http, port: 80, targetPort: 3000 } ]
